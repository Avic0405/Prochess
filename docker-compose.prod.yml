version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: chess_postgres_prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - chess_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 30s
      timeout: 10s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: chess_redis_prod
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - chess_network

  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
      target: production
    container_name: chess_backend_prod
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ./apps/backend/.env.production
    ports:
      - "4000:4000"
    networks:
      - chess_network

  nginx:
    image: nginx:alpine
    container_name: chess_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/ssl:/etc/ssl:ro
    depends_on:
      - backend
    networks:
      - chess_network

networks:
  chess_network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
