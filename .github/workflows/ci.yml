name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: '20'

jobs:
  # ─────────────────────────────────────────────
  # Backend: lint, typecheck, build, test
  # ─────────────────────────────────────────────
  backend:
    name: Backend — Lint / Build / Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client (SQLite)
        working-directory: apps/backend
        run: npx prisma generate
        env:
          DATABASE_URL: file:./prisma/ci.db

      - name: Run migrations
        working-directory: apps/backend
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: file:./prisma/ci.db

      - name: Lint
        working-directory: apps/backend
        run: npm run lint

      - name: Build
        working-directory: apps/backend
        run: npm run build

      - name: Test
        working-directory: apps/backend
        run: npm run test:ci
        env:
          DATABASE_URL: file:./prisma/ci.db
          JWT_ACCESS_SECRET: ci_access_secret_32_chars_minimum_x
          JWT_REFRESH_SECRET: ci_refresh_secret_32_chars_minimum_x
          NODE_ENV: test

  # ─────────────────────────────────────────────
  # Frontend: lint, typecheck, build
  # ─────────────────────────────────────────────
  frontend:
    name: Frontend — Lint / Typecheck / Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        working-directory: apps/frontend
        run: npm run lint

      - name: Type check
        working-directory: apps/frontend
        run: npm run type-check

      - name: Build
        working-directory: apps/frontend
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
          NEXT_PUBLIC_WS_URL: http://localhost:4000
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_placeholder
          NEXT_PUBLIC_RAZORPAY_KEY_ID: rzp_test_placeholder

  # ─────────────────────────────────────────────
  # Gate: both jobs must pass before deploy
  # ─────────────────────────────────────────────
  deploy-staging:
    name: Deploy → Staging
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to staging
        run: |
          echo "Add your staging deploy steps here."
          echo "Examples: Railway CLI, Render hooks, SSH deploy, Docker push."

  deploy-production:
    name: Deploy → Production
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy backend
        run: |
          echo "Add backend deploy steps here (AWS ECS, Railway, Render…)."

      - name: Deploy frontend
        run: |
          echo "Add frontend deploy steps here (Vercel CLI or Vercel GitHub integration)."
